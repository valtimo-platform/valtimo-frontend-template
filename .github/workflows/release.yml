name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to be released'
        required: true
  repository_dispatch:
    types: [release]

env:
  VERSION: ${{ inputs.version || github.event.client_payload.version }}

  DOCKER_REPO: ritense/gzac-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade version
        run: |
          sed -r -i 's/"@valtimo\/([a-z0-9_-]+)".+/"@valtimo\/\1": "${{ env.VERSION }}",/' package.json

      - name: Determine Node.js version
        id: node-version
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == v/10* || "$BRANCH" == v/11* ]]; then
            echo "version=16" >> "$GITHUB_OUTPUT"
          else
            echo "version=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: npm install

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade to ${{ env.VERSION }}"
          git tag -a "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
          git push origin HEAD
          git push origin "${{ env.VERSION }}"

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.VERSION }}
